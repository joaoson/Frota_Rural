# Local overlay: use with compose.yaml (+ compose.development.yaml if using dev.py).
services:
  backend:
    environment:
      METRICS_TOKEN_FILE: /run/secrets/metrics_token
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1,backend
      DB_CONNECT_TIMEOUT: 2
    secrets: [metrics_token]
  prometheus:
    image: prom/prometheus:v3.2.1
    command: ["--config.file=/etc/prometheus/prometheus.yml", "--storage.tsdb.retention.time=7d"]
    ports: ["127.0.0.1:${PROMETHEUS_PORT:-9090}:9090"]
    volumes:
      - ./Devops/observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./Devops/observability/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus_data:/prometheus
    secrets: [metrics_token]
    depends_on: [backend, alertmanager]
  alertmanager:
    image: prom/alertmanager:v0.28.1
    command: ["--config.file=/etc/alertmanager/alertmanager.yml"]
    ports: ["127.0.0.1:${ALERTMANAGER_PORT:-9093}:9093"]
    volumes:
      - ./Devops/observability/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - alertmanager_data:/alertmanager
  grafana:
    image: grafana/grafana:11.6.0
    environment:
      GF_SECURITY_ADMIN_PASSWORD__FILE: /run/secrets/grafana_password
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
    ports: ["127.0.0.1:${GRAFANA_PORT:-3000}:3000"]
    secrets: [grafana_password]
    volumes:
      - ./Devops/observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./Devops/observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    depends_on: [prometheus]
secrets:
  metrics_token:
    file: .observability/metrics-token
  grafana_password:
    file: .observability/grafana-password
volumes:
  prometheus_data:
  alertmanager_data:
  grafana_data:
