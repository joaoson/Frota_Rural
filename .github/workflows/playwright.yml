name: Quality and browser tests
on:
  push:
    branches: [develop, acceptance, main, develop_joaofre_locacoes_integradas]
  pull_request:
    branches: [develop, acceptance, main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: playwright-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  config-checks:
    timeout-minutes: 5
    runs-on: ubuntu-latest
    env:
      COMPOSE_PROJECT_NAME: frota-ci
    steps:
      - uses: actions/checkout@v4
      - name: Test development environment commands
        run: python3 -m unittest discover -s Devops/tests -v
      - name: Validate local Docker configuration
        # Never infer a hosted mode from main or a detached PR checkout in CI.
        run: python3 Devops/dev.py local config

  observability-checks:
    timeout-minutes: 5
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate monitoring configuration
        run: |
          python3 Devops/observability/setup.py
          docker compose --env-file /dev/null -f compose.yaml -f compose.observability.yaml config --quiet
          docker run --rm --entrypoint promtool -v "$PWD/Devops/observability:/rules:ro" -w /rules prom/prometheus:v3.2.1 test rules alerts.test.yml
          docker run --rm --entrypoint amtool -v "$PWD/Devops/observability:/rules:ro" prom/alertmanager:v0.28.1 check-config /rules/alertmanager.yml

  frontend-checks:
    timeout-minutes: 10
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: FrontEnd/package-lock.json
      - name: Install frontend dependencies
        working-directory: FrontEnd
        run: npm ci
      - name: Check extension configuration
        run: node --test ChromeExtension/tests/settings.test.cjs
      - name: Check frontend and browser test types
        working-directory: FrontEnd
        run: |
          npm run lint
          npm run build
          npm run test:e2e:typecheck
          npm run test:coverage
      - name: Publish frontend coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-coverage
          path: test-reports/frontend/
          if-no-files-found: error
          retention-days: 30

  browser-tests:
    needs: config-checks
    timeout-minutes: 30
    runs-on: ubuntu-latest
    env:
      COMPOSE_PROJECT_NAME: frota-ci
      # Use only the local base stack, including for main and detached PR refs.
      COMPOSE_FILE: compose.yaml
      E2E_BASE_URL: http://localhost:5173
      E2E_API_URL: http://localhost:8000/api/
      # This job uses a disposable local database and no live provider credentials.
      DATABASE_URL: ""
      DB_SCHEMA: ""
      DB_SSLMODE: disable
      DB_SSLROOTCERT: ""
      RUN_MIGRATIONS: auto
      STRIPE_SECRET_KEY: ""
      STRIPE_WEBHOOK_SECRET: ""
      RESEND_API_KEY: ""
      FIREBASE_STORAGE_BUCKET: ""
      GROQ_API_KEY: ""
      GEMINI_API_KEY: ""
      ANTHROPIC_API_KEY: ""
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: FrontEnd/package-lock.json
      - name: Install frontend dependencies
        working-directory: FrontEnd
        run: npm ci
      - name: Install browser dependencies
        working-directory: FrontEnd
        run: npx playwright install --with-deps
      - name: Let the backend container write coverage reports
        # The checkout belongs to the runner user, while the backend runs as appuser (uid 1000)
        # with BackEnd mounted at /app: without this, coverage cannot create /app/.coverage.
        run: mkdir -p BackEnd/coverage-report && chmod a+rwx BackEnd BackEnd/coverage-report
      - name: Start isolated Docker stack
        run: docker compose up --build -d
      - name: Wait for frontend and backend
        run: |
          curl --retry 60 --retry-all-errors --retry-delay 2 --fail --silent --show-error http://localhost:5173/ > /dev/null
          curl --retry 60 --retry-all-errors --retry-delay 2 --fail --silent --show-error http://localhost:8000/api/schema/swagger-ui > /dev/null
      - name: Check backend and run regression tests
        run: |
          docker compose exec -T backend python manage.py check
          docker compose exec -T backend python manage.py makemigrations --check --dry-run
          docker compose exec -T backend python -m pip install -r docs/requirements-coverage.txt
          docker compose exec -T backend python -m coverage run manage.py test --noinput
      - name: Generate backend coverage reports
        if: always()
        run: |
          docker compose exec -T backend python -m coverage html --fail-under=0
          docker compose exec -T backend python -m coverage json --fail-under=0
          docker compose exec -T backend python -m coverage xml --fail-under=0
          docker compose exec -T backend python -m coverage report
      - name: Validate and export API documentation
        run: docker compose exec -T backend python manage.py spectacular --validate --fail-on-warn --format openapi-json --file coverage-report/openapi.json
      - name: Publish backend coverage and OpenAPI
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage-and-openapi
          path: BackEnd/coverage-report/
          if-no-files-found: error
          retention-days: 30
      - name: Test Chromium, Firefox and WebKit
        working-directory: FrontEnd
        run: npm run test:e2e
      - name: Test unpacked Chrome extension against local Django
        run: |
          npm ci --prefix ChromeExtension
          FROTA_TEST_BACKEND=frota-ci-backend-1 npm run test:browser --prefix ChromeExtension
      - name: Capture container logs
        if: always()
        run: docker compose logs --no-color > FrontEnd/docker-e2e.log
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: |
            FrontEnd/playwright-report/
            FrontEnd/test-results/
            FrontEnd/docker-e2e.log
          retention-days: 14
      - name: Stop test stack
        if: always()
        run: docker compose down -v
