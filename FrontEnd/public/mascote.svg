<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200" role="img" aria-label="Mascote Frota Rural: um cowboy fofo">
  <defs>
    <clipPath id="fr-badge"><circle cx="100" cy="100" r="100"/></clipPath>
  </defs>
  <g clip-path="url(#fr-badge)">
    <!-- fundo -->
    <circle cx="100" cy="100" r="100" fill="#0A3701"/>

    <!-- corpo -->
    <rect x="50" y="134" width="100" height="80" rx="36" fill="#FFFAEB"/>
    <!-- lenco no pescoco -->
    <path d="M74 134 H126 Q126 158 100 166 Q74 158 74 134 Z" fill="#FEB734"/>

    <!-- orelhas -->
    <circle cx="56" cy="102" r="10" fill="#FFFAEB"/>
    <circle cx="144" cy="102" r="10" fill="#FFFAEB"/>

    <!-- rosto -->
    <rect x="58" y="58" width="84" height="82" rx="40" fill="#FFFAEB"/>

    <!-- chapeu -->
    <path d="M70 68 V48 Q70 26 100 26 Q130 26 130 48 V68 Z" fill="#FEB734"/>
    <rect x="69" y="45" width="62" height="11" rx="5.5" fill="#0A3701"/>
    <ellipse cx="100" cy="70" rx="66" ry="13" fill="#FEB734"/>

    <!-- olhos -->
    <circle cx="86" cy="98" r="6.5" fill="#0A3701"/>
    <circle cx="114" cy="98" r="6.5" fill="#0A3701"/>
    <!-- bochechas -->
    <circle cx="70" cy="110" r="7" fill="#FEB734"/>
    <circle cx="130" cy="110" r="7" fill="#FEB734"/>
    <!-- sorriso -->
    <path d="M89 113 Q100 124 111 113" fill="none" stroke="#0A3701" stroke-width="5.5" stroke-linecap="round"/>
  </g>
</svg>
